# OSV-Scanner policy (SECURITY-CI.md, "OSV-Scanner"). Every ignore names the advisory, why it does not
# reach anything wYEC ships, and an expiry no more than 90 days out; on expiry the check fails again.
#
# All three are in contrib/semgrep/requirements.txt, the hash-locked Semgrep CLI shared verbatim by every
# Yellowback repo (its source of record is ycash-dd): fixed there, then copied here, not diverged locally.
# Semgrep runs only on a CI runner over this repository's own files; none of these packages is a
# dependency of the contracts, the deployment script or anything Hawkeye fetches.

[[IgnoredVulns]]
id = "PYSEC-2026-4320"
ignoreUntil = 2026-11-22
reason = "certifi 2026.7.22 in the shared Semgrep lock (CI-only scanner). Fixed in certifi 2026.10.19; pending the ycash-dd requirements bump that every repo copies."

[[IgnoredVulns]]
id = "GHSA-6q48-6c7w-9gw2"
ignoreUntil = 2026-11-22
reason = "Alias of PYSEC-2026-4320 (certifi, shared Semgrep lock); see above."

