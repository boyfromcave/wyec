# Dependabot: security updates only, one grouped PR per ecosystem (SECURITY-CI.md). Version updates
# are off (open-pull-requests-limit: 0): dependencies are exact-pinned and moved deliberately
# (package.json / package-lock.json; action SHAs). The hash-locked Python requirements under contrib/
# are regenerated by hand (their headers have the command); OSV-Scanner watches them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
